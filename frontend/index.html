<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toasty Studio</title>
</head>
<body>
  <main id="home" hidden>
    <div class="brand-block">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="#dc2626"/>
        <text x="16" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#fff">T</text>
      </svg>
      <strong>Toasty Studio</strong>
    </div>
    <h1>Start a meeting</h1>
    <p class="muted">Enter your name and create a room. Share the link with your guests.</p>
    <input id="homeName" placeholder="Your name" maxlength="40" autocomplete="name" />
    <button id="create" class="ctl primary">Start meeting</button>
    <p id="homeError" class="error" role="alert"></p>
  </main>

  <main id="lobby" hidden>
    <div class="brand-block">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="16" fill="#dc2626"/>
        <text x="16" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#fff">T</text>
      </svg>
      <strong>Toasty Studio</strong>
    </div>
    <h1>Join meeting</h1>
    <video id="preview" autoplay muted playsinline></video>
    <input id="lobbyName" placeholder="Your name" maxlength="40" autocomplete="name" />
    <div class="lobby-actions">
      <button id="join" class="ctl primary" disabled>Join Meeting</button>
      <button id="cancel" class="ctl">Cancel</button>
    </div>
    <p id="lobbyError" class="error" role="alert"></p>
  </main>

  <section id="room" hidden>
    <header id="bar">
      <div class="brand-block brand-block--compact">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="16" fill="#dc2626"/>
          <text x="16" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#fff">T</text>
        </svg>
        <strong>Toasty Studio</strong>
      </div>
      <div class="bar-right">
        <span id="conn" data-state="connecting">Connecting</span>
        <span id="status" role="status"></span>
      </div>
    </header>
    <div id="stage">
      <div id="grid"></div>
      <aside id="panel" hidden></aside>
    </div>
    <nav id="controls"></nav>
  </section>

  <section id="ended" hidden>
    <h1>Meeting closed</h1>
    <p id="endedText" class="muted"></p>
    <a class="ctl primary" href="/">Back to start</a>
  </section>

  <dialog id="leaveDialog">
    <form method="dialog">
      <h2>Leave meeting?</h2>
      <p class="muted">You are the host. Leave and the meeting keeps running, or end it for everyone.</p>
      <div class="actions">
        <button value="cancel" class="ctl">Cancel</button>
        <button value="leave" class="ctl">Leave meeting</button>
        <button value="end" class="ctl danger">End for everyone</button>
      </div>
    </form>
  </dialog>

  <dialog id="reportDialog">
    <pre id="reportBody"></pre>
    <form method="dialog" class="actions">
      <button type="button" id="reportDownload" class="ctl">Download JSON</button>
      <button class="ctl">Close</button>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
